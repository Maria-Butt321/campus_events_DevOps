<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact – Campus Events</title>
  <link rel="stylesheet" href="../styles/style.css" />
</head>
<body>

  <header>
    <h1>Contact Us</h1>
  </header>

  <main>
    <section>
      <h2>Get in Touch</h2>
      <p>We’d love to hear from you! Whether you have questions, suggestions, or want to get involved, please use the contact form below.</p>
      
      <form action="#" method="POST">
        <label for="name">Name:</label><br />
        <input type="text" id="name" name="name" placeholder="Your full name" required /><br /><br />
        
        <label for="email">Email:</label><br />
        <input type="email" id="email" name="email" placeholder="you@example.com" required /><br /><br />
        
        <label for="message">Message:</label><br />
        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea><br /><br />
        
        <button type="submit">Send Message</button>
      </form>
    </section>

    <section>
      <h2>Follow Us</h2>
      <p>Connect with us on social media:</p>
      <ul>
        <li><a href="https://facebook.com/campusevents" target="_blank" rel="noopener noreferrer">Facebook</a></li>
        <li><a href="https://twitter.com/campusevents" target="_blank" rel="noopener noreferrer">Twitter</a></li>
        <li><a href="https://instagram.com/campusevents" target="_blank" rel="noopener noreferrer">Instagram</a></li>
        <li><a href="https://linkedin.com/company/campusevents" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
      </ul>
    </section>
  </main>

</body>
</html>
